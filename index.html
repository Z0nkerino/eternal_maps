<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Eternal Maps</title>
    <meta name="description" content="Your places, routes and journeys — in one calm place. Private, by Eternal Inc." />
    <meta name="author" content="Eternal Inc." />
    <meta name="application-name" content="Eternal Maps" />
    <meta name="apple-mobile-web-app-title" content="Eternal Maps" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Apply theme before first paint (no flash) — same as Universal Planner.
      (function () {
        try {
          var t = localStorage.getItem('em.theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.removeAttribute('media');
            m.setAttribute('content', dark ? '#0A0A0A' : '#FFFFFF');
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Eternal Maps needs JavaScript to draw the map.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
